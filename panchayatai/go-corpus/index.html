<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panchayat AI — शासनादेश व नियम</title>
<style>
:root{color-scheme:light;font-family:"Nirmala UI",system-ui,sans-serif;color:#17332c;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}header{background:#123f35;color:#fff;padding:32px max(20px,calc((100vw - 1000px)/2))}header a{color:#bdf2d7;text-decoration:none;font-size:14px}h1{font-size:clamp(26px,5vw,40px);margin:16px 0 8px}header p{color:#d0e6de;margin:0;line-height:1.7}main{max-width:1040px;margin:auto;padding:24px 20px 60px}.search{display:flex;gap:10px}input[type=search]{width:100%;border:1px solid #a4c1b4;background:#fff;border-radius:12px;padding:15px;font:inherit;outline-offset:3px}button{font:inherit;background:#176449;color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.examples{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.examples button,.secondary{background:#e1eee7;color:#24533e;padding:9px 12px}.status{min-height:28px;color:#46665a;margin:16px 0}.source{background:white;border:1px solid #d6e3dc;border-radius:16px;padding:22px;margin:16px 0}.source h2{font-size:20px;line-height:1.6;margin:0 0 10px}.meta{color:#517464;font-size:14px;line-height:1.8}.extract{line-height:1.9;color:#364e43;max-height:180px;overflow:auto;white-space:pre-wrap}.pages{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.pages label{padding:7px 10px;border:1px solid #d3e0d9;border-radius:8px}.pages input{accent-color:#176449}.empty{padding:28px 0;line-height:1.9;color:#506a5d}footer{border-top:1px solid #d6e3dc;padding-top:20px;margin-top:28px;font-size:13px;color:#62766b}#combine{display:none;margin:20px 0}@media(max-width:520px){.search{flex-direction:column}.source{padding:16px}header{padding:24px 20px}}
</style></head><body><header><a href="https://techgaon.in/panchayatai/">← Panchayat AI</a><h1>शासनादेश व नियम</h1><p>विषय या आदेश संख्या से खोजें। जरूरी मूल पन्ने चुनकर एक PDF में डाउनलोड करें।</p></header><main>
<form id="form" class="search"><input type="search" id="question" placeholder="जैसे: सामुदायिक शौचालय मानदेय" aria-label="आदेश का विषय या संख्या" required maxlength="2000"><button id="searchButton">खोजें</button></form>
<div class="examples"><button type="button">सामुदायिक शौचालय मानदेय</button><button type="button">समेकित तहसील गांव निधि</button><button type="button">सचिव अवकाश</button><button type="button">जन्म मृत्यु नियमावली</button></div>
<p class="status" id="status" role="status">संग्रह लोड हो रहा है…</p><button id="combine" type="button">चुने हुए सभी संदर्भ पन्ने एक PDF में डाउनलोड करें</button><section id="results" aria-live="polite"></section><footer>केवल समीक्षा के बाद जोड़े गए Acts, नियम, GO और DM/CDO/DPRO/DDO/BDO के आदेश। तिथि, धनराशि और लागू प्रावधान की पुष्टि मूल पन्ने से करें।</footer></main>
<script>window.PAI_CONFIG={referenceCatalog:new URL('catalog.json',location.href).href};</script><script src="reference-search.js"></script><script src="reference-static-client.js"></script><script>
const el=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let hits=[];
const selected=()=>hits.map((h,i)=>({...h,pages:[...document.querySelectorAll('[data-source="'+i+'"]:checked')].map(x=>Number(x.value))})).filter(h=>h.pages.length);
async function download(button,items){button.disabled=true;try{const r=await PAI_REFERENCES.downloadMany(items);el('status').textContent=r.pages+' संदर्भ पन्नों की PDF तैयार हुई।';}catch(e){el('status').textContent=e.message;}finally{button.disabled=false;}}
el('form').onsubmit=async e=>{e.preventDefault();el('searchButton').disabled=true;el('status').textContent='संबंधित आदेश खोज रहे हैं…';try{hits=await PAI_REFERENCES.search(el('question').value);el('results').innerHTML=hits.length?hits.map((h,i)=>'<article class="source"><h2>'+esc(h.title)+'</h2><div class="meta">'+esc([h.officialNumber,h.date,h.jurisdiction].filter(Boolean).join(' · '))+'</div><p class="extract">'+esc(h.passages[0]?.text.slice(0,550))+'</p><div class="pages">'+h.pages.map(p=>'<label><input type="checkbox" checked data-source="'+i+'" value="'+p+'"> पृष्ठ '+p+'</label>').join('')+'</div><button type="button" data-download="'+i+'">चुने हुए संदर्भ पन्ने डाउनलोड करें</button></article>').join(''):'<div class="empty">इस विषय का स्पष्ट मिलान उपलब्ध संग्रह में नहीं मिला। आदेश संख्या या विषय के दूसरे शब्द डालकर खोजें।</div>';el('combine').style.display=hits.length>1?'block':'none';el('results').querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>download(b,selected().filter(h=>h.id===hits[Number(b.dataset.download)].id)));el('status').textContent=hits.length+' संबंधित दस्तावेज मिले।';}catch(e){el('status').textContent=e.message;}finally{el('searchButton').disabled=false;}};
el('combine').onclick=()=>download(el('combine'),selected());document.querySelectorAll('.examples button').forEach(b=>b.onclick=()=>{el('question').value=b.textContent;el('form').requestSubmit();});
PAI_REFERENCES.load().then(d=>{el('status').textContent=d.catalog.documentCount+' दस्तावेज · '+d.catalog.pageCount+' संदर्भ पन्ने'+(d.catalog.incompleteArchive?' · कुछ अस्पष्ट फाइलें संग्रह में शामिल नहीं हैं':'');}).catch(e=>{el('status').textContent=e.message;});
</script></body></html>
