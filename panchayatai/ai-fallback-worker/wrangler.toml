name = "panchayat-ai-fallback"
main = "src/index.js"
compatibility_date = "2026-11-21"
workers_dev = true

# Only this API route, not the GitHub Pages website, is handled by the Worker.
routes = [
  { pattern = "techgaon.in/panchayatai/api/*", zone_name = "techgaon.in" }
]

[ai]
binding = "AI"

[vars]
FIREBASE_PROJECT_ID = "panchayat-ai-f00d5"
ALLOWED_ORIGIN = "https://techgaon.in"
GROQ_MODEL = "openai/gpt-oss-20b"
CF_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
# Remain off until confirming the Workers AI account will not incur paid overages.
ENABLE_CF_AI = "false"

[[ratelimits]]
name = "LIMITER"
namespace_id = "814621"
  [ratelimits.simple]
  limit = 20
  period = 60
