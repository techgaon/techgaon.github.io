name: Panchayat AI Draft and Letterhead Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'panchayatai/app.js'
      - 'panchayatai/ai.js'
      - 'panchayatai/drafting-core.mjs'
      - 'panchayatai/drafting.test.mjs'
      - 'panchayatai/drafting-corpus.mjs'
      - 'panchayatai/letterhead.js'
      - 'panchayatai/docx-export.js'
      - 'panchayatai/draft-card.js'
      - 'panchayatai/draft-workspace.js'
      - 'panchayatai/hindi-profile.js'
      - 'panchayatai/hindi-profile.test.cjs'
      - 'panchayatai/letterhead-mode.test.cjs'
      - 'panchayatai/workspace.css'
      - 'panchayatai/config.js'
      - 'panchayatai/index.html'
      - '.github/workflows/panchayat-letterhead-draft-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -e
          for f in panchayatai/{app,letterhead,draft-card,draft-workspace,docx-export,ux,editor,dashboard,hindi-profile}.js panchayatai/ai.js panchayatai/{drafting-core,drafting-corpus,drafting.test}.mjs; do
            test -s "$f"
            node --check "$f"
          done
      - name: Pure drafting regression tests
        run: node --test panchayatai/drafting.test.mjs panchayatai/hindi-profile.test.cjs panchayatai/letterhead-mode.test.cjs
      - name: Review UI integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('panchayatai/app.js').read_text()
          html=Path('panchayatai/index.html').read_text()
          card=Path('panchayatai/draft-card.js').read_text()
          head=Path('panchayatai/letterhead.js').read_text()
          assert '<a data-go="letterhead"' in html
          assert 'letterhead:letterheadScreen' in app
          assert 'PAI_LETTERHEAD' in card
          assert 'gp_office' in app and 'gp_office' in head
          assert 'createBlob' in Path('panchayatai/docx-export.js').read_text()
          assert 'letterhead.css' in html and 'letterhead.js' in html
          core=Path('panchayatai/drafting-core.mjs').read_text()
          settings=Path('panchayatai/config.js').read_text()
          workspace=Path('panchayatai/draft-workspace.js').read_text()
          assert 'draft-workspace.js' in html and 'workspace.css' in html
          assert 'PAI_DRAFT_WORKSPACE.mount' in app
          assert 'S.view = "chat"' not in app[app.index('function draftEdit(el)'):app.index('function history(el)')]
          assert 'id="paiStartNewChat"' in app and 'chat_archives_v1_' in app
          assert 'News Chat' not in app and 'news-chat.js' not in html
          assert 'freeLimitsEnabled===true' in app and 'if(limit===Infinity)return' in app
          assert 'plusLimitsEnabled===true' in app
          assert 'dailyChats: null, dailyDrafts: null' in settings
          assert 'nameHindi' in app and 'name:str(p.nameHindi||p.name)' in core
          assert 'charCodeAt(0)-2406' in core
          assert 'id="dNameHindi"' in app
          assert '<button class="btn-sm hidden" id="loginTop">' in html
          assert 'S.authReady = !S.auth' in app
          assert 'PAI_DRAFT_CARD.mount' in workspace
          assert '<script src="draft-workspace.js' in html
          assert 'mode' in head and 'gp_office' in head
          assert 'new Function' not in workspace
          assert '<script src="hindi-profile.js' in html
          assert 'id="pNameHindi"' in app and 'id="pPhone"' in app
          assert 'id="aBlockHindi"' in app and 'data-hindi-gp' in app
          assert 'gpsHindi:mapping' in app
          assert 'hindiProfileReviewed:true' in app
          assert 'S.after="draftEdit"' not in app[app.index('function draftEdit(el)'):app.index('function history(el)')]
          assert 'resolveGp(payload,b)' in core
          assert 'if(selected)return {gp:selected' in core
          print('Login, New Chat, unlimited quotas, Hindi name and Draft Studio gates OK')
          print('Letterhead UI and export integration checks OK')
          PY
