name: Build Panchayat AI Installable APKs
on:
  workflow_dispatch:
  push:
    branches: [panchayat-android-20261120]
    paths:
      - .github/workflows/panchayat-installable.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Recover original Android project
        shell: bash
        run: |
          cat android-build-transfer/part-* | base64 -d > /tmp/panchayat-transfer.zip
          mkdir -p /tmp/panchayat-original
          unzip -q /tmp/panchayat-transfer.zip -d /tmp/panchayat-original
          unzip -q /tmp/panchayat-original/PanchayatAI-Android-source.zip
          test -f panchayat-android/app/build.gradle
      - name: Update original package to v1.0.2 and add app-return handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project=Path("panchayat-android")
          build=project/"app/build.gradle"
          src=build.read_text(encoding="utf-8")
          assert "applicationId 'in.techgaon.panchayatai'" in src
          assert "versionCode 1" in src and "versionName '1.0.0'" in src
          src=src.replace("versionCode 1","versionCode 3").replace("versionName '1.0.0'","versionName '1.0.2'")
          build.write_text(src,encoding="utf-8")
          manifest=project/"app/src/main/AndroidManifest.xml"
          xml=manifest.read_text(encoding="utf-8")
          assert 'android:pathPrefix="/panchayatai/"' in xml
          # Explicit custom-scheme return to the installed app without exposing OAuth tokens.
          token='   <intent-filter android:autoVerify="true">'
          assert token in xml
          xml=xml.replace(token,
            '   <intent-filter>\n'
            '    <action android:name="android.intent.action.VIEW"/>\n'
            '    <category android:name="android.intent.category.DEFAULT"/>\n'
            '    <category android:name="android.intent.category.BROWSABLE"/>\n'
            '    <data android:scheme="panchayatai" android:host="open"/>\n'
            '   </intent-filter>\n'+token,1)
          manifest.write_text(xml,encoding="utf-8")
          PY
      - name: Assemble existing package upgrade
        working-directory: panchayat-android
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Save existing package unsigned APK
        shell: bash
        run: |
          mkdir -p out
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 panchayat-android/app/build/outputs/apk/release/app-release-unsigned.apk out/PanchayatAI-v1.0.2-Update-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging out/PanchayatAI-v1.0.2-Update-unsigned.apk | head -25 > out/Update-package-info.txt
      - name: Make clean-install package to avoid signature mismatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build=Path("panchayat-android/app/build.gradle")
          content=build.read_text(encoding="utf-8")
          old="applicationId 'in.techgaon.panchayatai'"
          assert old in content
          build.write_text(content.replace(old,"applicationId 'in.techgaon.panchayatai.fresh'"),encoding="utf-8")
          manifest=Path("panchayat-android/app/src/main/AndroidManifest.xml")
          xml=manifest.read_text(encoding="utf-8")
          old='android:label="पंचायत AI"'
          assert old in xml
          xml=xml.replace(old,'android:label="पंचायत AI नया"')
          manifest.write_text(xml,encoding="utf-8")
          PY
      - name: Assemble clean-install APK
        working-directory: panchayat-android
        run: gradle --no-daemon clean assembleRelease lintRelease
      - name: Validate and collect clean-install unsigned APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 panchayat-android/app/build/outputs/apk/release/app-release-unsigned.apk out/PanchayatAI-v1.0.2-Fresh-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging out/PanchayatAI-v1.0.2-Fresh-unsigned.apk | head -25 > out/Fresh-package-info.txt
          sha256sum out/*.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PanchayatAI-v1.0.2-Installable-Builds
          path: out/*
          retention-days: 30
