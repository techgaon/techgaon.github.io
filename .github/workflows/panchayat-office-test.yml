name: Panchayat Office Format Payment and IGRS
on:
  workflow_dispatch:
  push:
    branches: [main, office-payments-igrs-20261122, go-full-doc-ui-20261122]
    paths:
      - 'panchayatai/app.js'
      - 'panchayatai/ai.js'
      - 'panchayatai/tools.js'
      - 'panchayatai/drafting-core.mjs'
      - 'panchayatai/draft-card.js'
      - 'panchayatai/draft-workspace.js'
      - 'panchayatai/docx-export.js'
      - 'panchayatai/payment-flow.js'
      - 'panchayatai/go-full-pdf.js'
      - 'panchayatai/office-*.test.*'
      - 'panchayatai/payment-security.test.cjs'
      - '.github/workflows/panchayat-office-test.yml'
permissions:
  contents: read
jobs:
  format-and-exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and drafting regressions
        run: |
          node --check panchayatai/app.js
          node --check panchayatai/draft-card.js
          node --check panchayatai/draft-workspace.js
          node --check panchayatai/payment-flow.js
          node --input-type=module --check < panchayatai/ai.js
          node --test panchayatai/drafting.test.mjs panchayatai/office-format.test.mjs panchayatai/letterhead-mode.test.cjs
      - name: Install isolated export test tools
        run: |
          mkdir -p /tmp/pai-office-tests
          cd /tmp/pai-office-tests
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1 html2pdf.js@0.10.1 docx@9.5.1 jszip@3 pngjs@7 jsqr@1.4.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - name: Test real PDF DOCX and UPI QR
        env:
          NODE_PATH: /tmp/pai-office-tests/node_modules
        run: node panchayatai/office-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-export-preview
          path: office-test-artifacts
  payment-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase emulator tests
        run: |
          mkdir -p /tmp/pai-payment-tests
          cd /tmp/pai-payment-tests
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase-tools@14 @firebase/rules-unit-testing@4 firebase@11
      - name: Verify private proof and admin-only Plus activation
        env:
          NODE_PATH: /tmp/pai-payment-tests/node_modules
        run: |
          printf '{"firestore":{"rules":"panchayatai/firestore.rules"},"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > office-emulator.json
          /tmp/pai-payment-tests/node_modules/.bin/firebase emulators:exec --config office-emulator.json --only firestore --project demo-pai-office "node panchayatai/payment-security.test.cjs"
