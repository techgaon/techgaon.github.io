name: Check external GO document storage
on:
  push:
    branches: [main, panchayat-go-storage-20261123]
    paths:
      - panchayatai/reference-static-client.js
      - panchayatai/go-full-pdf.js
      - panchayatai/reference-asset-base.test.cjs
      - .github/workflows/panchayat-go-storage-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and verified PDF routing
        run: |
          node --check panchayatai/reference-static-client.js
          node --check panchayatai/go-full-pdf.js
          node --test panchayatai/reference-asset-base.test.cjs
