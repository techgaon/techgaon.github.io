name: Deploy reviewed Panchayat GO corpus
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: panchayat-go-corpus
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'panchayat-go-corpus-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download reviewed archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download panchayat-go-corpus-20261122 --repo techgaon/techgaon.github.io --pattern 'part-*.zip'
      - name: Verify and extract complete corpus
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          expected_parts=json.loads('{"part-00.zip":"3cd13fb0c5cfe3d7dfd1ac0a1d5f1490bd830ea4f0d8a775aea3aab34222e97c","part-01.zip":"98aea509dfc193fcba240c4563b52cbaf7c24058f3f0a9b03235fe30fbdc48d1","part-02.zip":"f8a2fe71615d50d9f670e9c86546afd3e5c6b03f67733c1169a354d9e3508860","part-03.zip":"b97a905c8ff42b2588019f9bfecc48946480bb73786947f7884b9ec3fe427e2f","part-04.zip":"1eb36f1777718f9f5d728c44d283146764a6e9f8a92a7af748bc4f3146131bd6","part-05.zip":"73698e701048e9fe1d304ec56867ef9933089bd694c8047b4c086e2bba820900","part-06.zip":"e16b92e2fcc458f569dccce05fb6edb86ae2f0181694cbca23f584e68877800c","part-07.zip":"cd63f9f09f78759d621832ab538cfa28d1f958a97d38dea8fbe107e27f415299","part-08.zip":"d6ad58d331f0e9752e8df7ae5ca4d06ba30113ef3c68cdba096c368c94182413","part-09.zip":"8efc29c507f86cf6d37d29521b94a6a2726b4377a5cf6f4000e79f68c8501978","part-10.zip":"8de66edd88907e1c227ddb262bc6c4e4194106d0deeb8837df69cfef3e8e0c88","part-11.zip":"65b0e86eac5e24bf09b3e3b44712157006970e6382df453b39d52e954dc007c6","part-12.zip":"b2f69b1ce0fcd81c3c50a6d24518217775160eeaf19ed3341a098d188cc868dc","part-13.zip":"079487c183a9a0314624aeff75fbaf85fc21a7dace138a05194634fbfac85fd5","part-14.zip":"221956acf5c3c349d547d9d961add78fe4bc51e26c610f2296c73876f02e3049","part-15.zip":"fa5566dba48df137295b045775bf577b969f0d7f22742a95099e77c154c21f13","part-16.zip":"ce4727abb08dac2ff15b5777643de19b4966413e3b3450b644edf6082d4b95bc","part-17.zip":"a71e5bf3a7f298645b780c24875e2dfcc4085868096651dc644a0b95d2a00dff","part-18.zip":"3b85612831cc59ae5ed50d301021052957e919ce3c17517751e11a8549a249af","part-19.zip":"98399a769156305480be974f549ca30c91f1ac2af83b27fc7c78f56c0a3a9cba","part-20.zip":"792673069cb0b506e3990a793477dc6c9b86dd0b1f88fc725e1d49431930f8b9","part-21.zip":"bc2d8eceb5560da66ce838224dc1517d5de36d6a1b8cd8f1cbf52c5cfff838f1","part-22.zip":"9dc51de71e109fcb5cf94f0207d77a40a347835797143929b3b023901e354ed9","part-23.zip":"37b3e63ddd2d1be4f5c282748e2dc9c00dab80e80e12ce432d4fca90f165c25b","part-24.zip":"747fc9b7279937348cad1d22e5fccffac067c8b4ea6cf937dbbdb9e09cffff8b","part-25.zip":"146296118d8d6c8c3ee2ce34b721af50d349168a9bd9d7b05df320ebceacbd1f","part-26.zip":"cf0c1cb06d0dece35d02462b8a4a4c85327e5a37845b8603c4e12fcfed268072","part-27.zip":"9e10ec2d3e7af9435396f11914a5ea2f8f9dd54fce1b6e07b0263b553b4e7fe8","part-28.zip":"20ce16cf22f0a4c131fee0ec095f4e8fac02595c443325a81a1e2f7407eaa791","part-29.zip":"861d4ee16c03713dbc09fd2153e9476ea6f95b1ff3a2350fea705fd5b9029cbb","part-30.zip":"d2faf8d4d259c80b99fbf09eed54aafb845ade4f14660a705989f67fd28dadf4","part-31.zip":"a210c89da48a93cd6d278b19d988145c6d6ad37c50762cc9f10b1d7905eb42c4","part-32.zip":"c69c1d68c8c6843023f334929259b8c2f971bfe9985082c6fa0239bad7e1118e","part-33.zip":"54b0b770dd95786691b512627f0829577e00da794f2c575c2464974e4c9ad774","part-34.zip":"67be5c91c5912769a2f15811e5a320dfedd44b0a2c1ba3e7c65b147770e9fb90","part-35.zip":"02c51c190904499f480750ee7be26566c20fff781a34b9aed6f7c42503edd64f","part-36.zip":"f83d9d5eb3610498cb7c5ec9c28a7393ee51a63d259f7371fdb4faac92d5b83b","part-37.zip":"4711ff189d85cbf7f7b6fbd16bce60c039bc1c6cb9143356a98b16857a17ee1d","part-38.zip":"f078982fb0fe7b11e78f50cd7a2e97a1212cde9c8b48b0fbcc4ff0269d034b4b","part-39.zip":"31ddf42cf4a0341322657a978aa66a263377bfe95ddf977adaf1f058648a1204","part-40.zip":"0e350683ca85418d3be38997ca69e6aa653904955328ba19e2bb4c6078d6610d","part-41.zip":"50532a072472892f94cfd9ce24fc3f241bcae8cc75629256e411946fd4574dc5","part-42.zip":"ea539230dad6197465ed3b1f46716cdbb3de4fd19cf72762389857e7c0815696","part-43.zip":"332f317a9bd4785c99ed8ea922984ec3318ee6e9f101e7627e1378b3964fb123"}')
          assert {p.name for p in Path('.').glob('part-*.zip')}==set(expected_parts)
          root=Path('corpus').resolve()
          seen=set()
          for name,sha in sorted(expected_parts.items()):
              archive=Path(name)
              assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()==sha
              with zipfile.ZipFile(archive) as z:
                  for f in z.infolist():
                      target=(root/f.filename).resolve()
                      assert target.is_relative_to(root) and not f.is_dir()
                      assert f.filename not in seen and f.file_size<25*1024*1024
                      seen.add(f.filename)
                  assert z.testzip() is None
                  z.extractall(root)
          assert len(seen)==511
          catalog=json.loads((root/'catalog.json').read_bytes())
          raw=(root/catalog['index']).read_bytes()
          assert hashlib.sha256(raw).hexdigest()==catalog['indexSha256']
          index=json.loads(raw)
          assert len(index['docs'])==290 and len(index['pages'])==2542
          allowed={'act','rules','go','dm_order','cdo_order','dpro_order','ddo_order','bdo_order'}
          expected={'catalog.json',catalog['index'],'index.html','reference-search.js','reference-static-client.js','vendor/pdflib.js','_headers'}
          for d in index['docs']:
              assert d['documentType'] in allowed
              for b in d['blocks']:
                  p=(root/b['file']).resolve()
                  assert p.is_relative_to(root/'blocks')
                  data=p.read_bytes()
                  assert len(data)==b['bytes'] and hashlib.sha256(data).hexdigest()==b['sha256']
                  expected.add(b['file'])
          assert {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}==expected
          print('Verified 511 assets, 290 documents and 2542 pages; all PDF SHA-256 checks passed.')
          PY
      - name: Include PDF module runtime dependency
        run: cp panchayatai/vendor/chunk-T4BHF35L.js corpus/vendor/chunk-T4BHF35L.js
      - name: Deploy all verified assets to existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 pages deploy corpus --project-name techgaon-panchayat-orders --branch main
      - name: Verify live catalog
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://techgaon-panchayat-orders.pages.dev/catalog.json -o live-catalog.json
          python3 - <<'PY'
          import json
          c=json.load(open('live-catalog.json'))
          assert c['documentCount']==290 and c['pageCount']==2542 and c['version']=='bd40167ca6eb3382'
          print('Live GO corpus verified.')
          PY
