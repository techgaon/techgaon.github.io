name: Build Panchayat AI Fullscreen TWA APK
on:
  workflow_dispatch:
  push:
    branches: [panchayat-android-20261120]
    paths:
      - .github/workflows/panchayat-fullscreen-twa.yml
      - panchayat-twa/MainActivity.java
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Recover last working Android source
        shell: bash
        run: |
          set -euo pipefail
          cat android-build-transfer/part-* | base64 -d > /tmp/panchayat-transfer.zip
          mkdir -p /tmp/panchayat-original
          unzip -q /tmp/panchayat-transfer.zip -d /tmp/panchayat-original
          unzip -q /tmp/panchayat-original/PanchayatAI-Android-source.zip
          test -f panchayat-android/app/src/main/AndroidManifest.xml
      - name: Configure signed-release v1.0.7 package and Trusted Web Activity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path("panchayat-android/app/build.gradle")
          code=gradle.read_text(encoding="utf-8")
          assert "namespace 'in.techgaon.panchayatai'" in code
          assert "applicationId 'in.techgaon.panchayatai'" in code
          assert "versionCode 1" in code
          assert "versionName '1.0.0'" in code
          code=code.replace("applicationId 'in.techgaon.panchayatai'",
                            "applicationId 'in.techgaon.panchayatai.fresh'")
          code=code.replace("versionCode 1","versionCode 8")
          code=code.replace("versionName '1.0.0'","versionName '1.0.7'")
          code=code.replace("dependencies {",
              "dependencies {\n implementation 'androidx.browser:browser:1.8.0';")
          gradle.write_text(code,encoding="utf-8")

          manifest=Path("panchayat-android/app/src/main/AndroidManifest.xml")
          xml=manifest.read_text(encoding="utf-8")
          assert 'android:name=".MainActivity"' in xml
          assert '@android:style/Theme.Translucent.NoTitleBar' in xml
          xml=xml.replace('android:name=".MainActivity"',
              'android:name="in.techgaon.panchayatai.MainActivity" android:launchMode="singleTop"')
          xml=xml.replace('@android:style/Theme.Translucent.NoTitleBar',
                          '@android:style/Theme.Material.Light.NoActionBar')
          token='   <intent-filter android:autoVerify="true">'
          assert token in xml
          xml=xml.replace(token,
            '   <intent-filter>\n'
            '    <action android:name="android.intent.action.VIEW"/>\n'
            '    <category android:name="android.intent.category.DEFAULT"/>\n'
            '    <category android:name="android.intent.category.BROWSABLE"/>\n'
            '    <data android:scheme="panchayatai" android:host="open"/>\n'
            '   </intent-filter>\n'+token,1)
          xml=xml.replace('<application ',
              '<queries><intent><action android:name="android.support.customtabs.action.CustomTabsService"/></intent><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries><application ',1)
          manifest.write_text(xml,encoding="utf-8")
          source=Path("panchayat-twa/MainActivity.java")
          target=Path("panchayat-android/app/src/main/java/in/techgaon/panchayatai/MainActivity.java")
          assert source.exists()
          source_text=source.read_text(encoding="utf-8")
          assert "fallbackView = root;" in source_text
          assert "showFallbackScreen()" in source_text
          assert "new Handler(Looper.getMainLooper()).postDelayed(this::openSite, 350)" not in source_text
          target.write_text(source_text,encoding="utf-8")
          PY
      - name: Verify Digital Asset Links actually published on website
        shell: bash
        run: |
          mkdir -p out
          curl --fail --location --silent --show-error --retry 2 --max-time 35 \
            --dump-header out/assetlinks-response-headers.txt \
            https://techgaon.in/.well-known/assetlinks.json \
            --output out/live-assetlinks.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rules=json.loads(Path("out/live-assetlinks.json").read_text(encoding="utf-8"))
          package="in.techgaon.panchayatai.fresh"
          fingerprint="A5:2A:86:67:0D:F3:D5:D0:4D:48:05:93:5B:0D:CC:63:3C:4F:48:09:FD:71:89:36:54:4E:67:AF:8F:49:79:81"
          verified=any(
            x.get("target",{}).get("package_name")==package and
            fingerprint in x.get("target",{}).get("sha256_cert_fingerprints",[]) and
            "delegate_permission/common.handle_all_urls" in x.get("relation",[])
            for x in rules
          )
          assert verified, "Site's live assetlinks.json missing APK fingerprint; Chrome would show toolbar"
          print("Verified live Digital Asset Links for",package)
          PY
      - name: Assemble and lint full-screen Android APK
        working-directory: panchayat-android
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Validate package and full-screen TWA launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK=panchayat-android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > out/manifest-info.txt
          grep -F "name='in.techgaon.panchayatai.fresh'" out/manifest-info.txt
          grep -F "versionCode='8'" out/manifest-info.txt
          grep -F "launchable-activity: name='in.techgaon.panchayatai.MainActivity'" out/manifest-info.txt
          unzip -l "$APK" | grep "classes.dex"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 "$APK" out/PanchayatAI-v1.0.7-Fullscreen-TWA-unsigned.apk
          sha256sum out/*apk > out/SHA256SUMS.txt
          # For local private-key signing after downloading this unsigned build.
          # The signing key is never sent to GitHub.
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/apksigner.jar
          test -s out/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PanchayatAI-v1.0.7-Fullscreen-TWA
          path: out/*
          retention-days: 30
