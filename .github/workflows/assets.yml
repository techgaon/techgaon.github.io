# Fetches website images: AI photos (from given URLs) + fresh FoodGaon app screenshots
name: Website images

on:
  workflow_dispatch:
    inputs:
      photos:
        description: "One per line: name url"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Download photos
        env:
          PHOTOS: ${{ github.event.inputs.photos }}
        run: |
          mkdir -p images raw
          printf '%s\n' "$PHOTOS" | while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSfL -o "raw/$name.png" "$url"
          done
          ls -la raw
      - name: App screenshots
        run: |
          cat > shot.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  ctx = await b.new_context(viewport={'width': 390, 'height': 844}, device_scale_factor=2, is_mobile=True, has_touch=True)
                  pg = await ctx.new_page()
                  await pg.goto('https://techgaon.in/foodgaon/', wait_until='domcontentloaded', timeout=60000)
                  await pg.wait_for_timeout(12000)
                  await pg.screenshot(path='raw/app-1.png')
                  await pg.get_by_text('Parag Milk Parlour & Restaurant').last.click(timeout=10000)
                  await pg.wait_for_timeout(5000)
                  await pg.evaluate("window.scrollBy(0,560); document.querySelectorAll('*').forEach(e=>{if(e.scrollHeight>e.clientHeight+50&&['auto','scroll'].includes(getComputedStyle(e).overflowY)){e.scrollTop+=560}})")
                  await pg.wait_for_timeout(3000)
                  await pg.screenshot(path='raw/app-3.png')
                  await pg.get_by_text('Lassi', exact=True).first.click(timeout=8000)
                  await pg.wait_for_timeout(10000)
                  await pg.screenshot(path='raw/app-4.png')
                  await b.close()
          asyncio.run(main())
          PY
          python shot.py || echo "screenshot step had a problem"
      - name: Convert to WebP
        run: |
          python - <<'PY'
          import os
          from PIL import Image
          for f in os.listdir('raw'):
              n, _ = os.path.splitext(f)
              im = Image.open('raw/' + f).convert('RGB')
              if n.startswith('ai-'):
                  im.thumbnail((1200, 1200))
              im.save('images/' + n + '.webp', 'WEBP', quality=80)
              print(n, os.path.getsize('images/' + n + '.webp') // 1024, 'KB')
          PY
      - name: Commit
        run: |
          git config user.name "TechGaon"
          git config user.email "contact@techgaon.in"
          git add images
          git commit -m "Website images" || echo "nothing new"
          git push
