name: Measure Panchayat corpus coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - panchayatai/corpus-coverage.py
      - .github/workflows/panchayat-coverage.yml
permissions:
  contents: write
concurrency:
  group: panchayat-coverage
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python panchayatai/corpus-coverage.py
      - run: |
          git config user.name 'TechGaon Data'
          git config user.email 'data@techgaon.in'
          git add panchayatai/corpus/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Measure unique usable Panchayat pages without counting OCR replacements twice'
          git pull --rebase origin main
          git push origin HEAD:main
