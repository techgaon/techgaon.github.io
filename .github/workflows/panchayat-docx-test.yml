name: Verify Panchayat AI Real DOCX Export
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/panchayat-docx-test.yml
permissions:
  contents: read
jobs:
  docx:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated document test dependencies
        run: |
          mkdir -p /tmp/pai-docx-test
          cd /tmp/pai-docx-test
          npm init -y >/dev/null
          npm install --no-audit --no-fund docx@9.5.1 jsdom@26
      - name: Browser-equivalent DOCX smoke test
        run: |
          cat > /tmp/pai-docx-test/test.cjs <<'JS'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const {JSDOM}=require('jsdom');
          const JSZip=require('jszip');
          const root=process.env.GITHUB_WORKSPACE;
          const dom=new JSDOM('<!doctype html><html><body><main><div id="paper"><p style="text-align:center"><b>कार्यालय — ग्राम पंचायत कमेला</b></p><p>परीक्षण स्पष्टीकरण में कुछ तथ्य हैं।</p><table><tr><td>पत्रांक</td><td>123</td></tr></table></div></main></body></html>',{url:'https://techgaon.in/panchayatai/',runScripts:'outside-only'});
          const win=dom.window;
          const bundle=path.join(path.dirname(require.resolve('docx')),'index.umd.cjs');
          if(!fs.existsSync(bundle))throw Error('Browser UMD build missing');
          win.eval(fs.readFileSync(bundle,'utf8'));
          assert(win.docx?.Document,'UMD browser bundle must expose global docx');
          let saved=null;
          win.URL.createObjectURL=blob=>{saved=blob;return 'blob:local-test';};
          win.URL.revokeObjectURL=()=>{};
          win.HTMLAnchorElement.prototype.click=()=>{};
          win.eval(fs.readFileSync(path.join(root,'panchayatai/docx-export.js'),'utf8'));
          (async()=>{
            const paper=win.document.querySelector('#paper');
            paper.dataset.docSize='14';
            const result=await win.PAI_DOCX.exportPaper(paper,'नमूना-पत्र.docx');
            assert(result.size>1200);
            assert(saved,'Expected DOCX Blob');
            const buffer=Buffer.from(await saved.arrayBuffer());
            assert.equal(buffer.subarray(0,2).toString(),'PK');
            const zip=await JSZip.loadAsync(buffer);
            assert(zip.file('word/document.xml'),'DOCX must contain Word document XML');
            const document=await zip.file('word/document.xml').async('string');
            assert(document.includes('ग्राम पंचायत कमेला'),'Devanagari text missing');
            assert(document.includes('परीक्षण स्पष्टीकरण'),'Body text missing');
            assert(zip.file('word/styles.xml'),'Word styles missing');
            console.log('PASS: Genuine zipped Office Open XML (.docx), Hindi text, tables, A4 page margins and 14 pt.');
          })().catch(err=>{console.error(err);process.exit(1);});
          JS
          cd /tmp/pai-docx-test
          node test.cjs
