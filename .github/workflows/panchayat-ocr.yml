name: Panchayat verified-source Hindi OCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - panchayatai/corpus-ocr.py
permissions:
  contents: write
concurrency:
  group: panchayat-corpus-ocr
  cancel-in-progress: false
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr-hin tesseract-ocr-eng
      - run: pip install pymupdf==1.26.6
      - run: python panchayatai/corpus-ocr.py --shard ${{ matrix.shard }} --total 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-ocr-${{ matrix.shard }}
          path: |
            panchayatai/corpus/ocr-${{ matrix.shard }}.json.gz
            panchayatai/corpus/ocr-status-${{ matrix.shard }}.json
  publish:
    if: always()
    needs: ocr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: corpus-ocr-*
          merge-multiple: true
          path: panchayatai/corpus
      - name: Record actual coverage
        run: |
          python panchayatai/corpus-coverage.py
      - name: Save OCR index
        run: |
          git config user.name 'TechGaon Data'
          git config user.email 'data@techgaon.in'
          git add panchayatai/corpus
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish checksum-verified Hindi OCR pages with honest unresolved counts'
          git pull --rebase origin main
          git push origin HEAD:main
