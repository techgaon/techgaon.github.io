name: Panchayat AI Android Login Return
on:
  workflow_dispatch:
  push:
    branches: [panchayat-android-20261120]
    paths:
      - .github/workflows/panchayat-login-return.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Recover verified original Android source
        shell: bash
        run: |
          cat android-build-transfer/part-* | base64 -d > /tmp/panchayat-transfer.zip
          mkdir /tmp/panchayat-original
          unzip -q /tmp/panchayat-transfer.zip -d /tmp/panchayat-original
          unzip -q /tmp/panchayat-original/PanchayatAI-Android-source.zip
          test -f panchayat-android/app/src/main/AndroidManifest.xml
      - name: Update package and Android app-return handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build=Path('panchayat-android/app/build.gradle')
          data=build.read_text(encoding='utf-8')
          assert "versionCode 1" in data and "versionName '1.0.0'" in data
          data=data.replace("versionCode 1","versionCode 2").replace("versionName '1.0.0'","versionName '1.0.1'")
          build.write_text(data,encoding='utf-8')
          manifest=Path('panchayat-android/app/src/main/AndroidManifest.xml')
          xml=manifest.read_text(encoding='utf-8')
          assert 'android:pathPrefix="/panchayatai/"' in xml
          token='   <intent-filter android:autoVerify="true">'
          assert token in xml
          # Keep the verified HTTPS App Link so external Chrome can explicitly
          # route the authenticated web session back into the TWA.
          # Additional scheme is a future-proof fallback and carries no tokens.
          xml=xml.replace(token,
              '   <intent-filter>\n'
              '    <action android:name="android.intent.action.VIEW"/>\n'
              '    <category android:name="android.intent.category.DEFAULT"/>\n'
              '    <category android:name="android.intent.category.BROWSABLE"/>\n'
              '    <data android:scheme="panchayatai" android:host="open"/>\n'
              '   </intent-filter>\n'+token,1)
          manifest.write_text(xml,encoding='utf-8')
          PY
      - name: Build and lint release APK
        working-directory: panchayat-android
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Collect zipaligned unsigned APK for owner signing
        shell: bash
        run: |
          mkdir out
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 \
            panchayat-android/app/build/outputs/apk/release/app-release-unsigned.apk \
            out/PanchayatAI-1.0.1-unsigned.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PanchayatAI-1.0.1-Login-Return
          path: out/*
          retention-days: 30
