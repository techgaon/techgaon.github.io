<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TechGaon — Enquiry inbox</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f0;color:#203c2d}header{background:#13513a;color:white;padding:20px}header a{color:#ffdb79}main{max-width:1100px;margin:24px auto;padding:0 16px}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #bac8bc;border-radius:9px;width:100%;background:white;color:#203c2d}button{cursor:pointer;background:#13513a;color:white;width:auto}button:disabled{opacity:.5}label{display:grid;gap:5px;margin:14px 0}form,.card{background:white;padding:22px;border-radius:16px;border:1px solid #d4dfd5;margin:15px 0}#login{max-width:430px;margin:40px auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row select,.row input{flex:1;min-width:180px}.muted{color:#5c6e60;font-size:.9rem}#message{white-space:pre-wrap}article p{white-space:pre-wrap;overflow-wrap:anywhere}article h2{font-size:1.2rem}.controls{display:grid;grid-template-columns:1fr 2fr auto;gap:12px;align-items:end}.controls textarea{min-height:80px}a{color:#13513a}[hidden]{display:none!important}@media(max-width:650px){.controls{grid-template-columns:1fr}header{font-size:.9rem}}</style></head>
<body><header><b>TechGaon · Enquiry inbox</b> <a href="/">Website</a></header><main>
<form id="login"><h1>Admin login</h1><p class="muted">For TechGaon website enquiries.</p><label>Email or mobile number<input id="username" autocomplete="username" required></label><label>Login PIN<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="current-password" required></label><button id="sign-in">Log in</button></form>
<p id="message" role="status" aria-live="polite"></p>
<section id="inbox" hidden><div class="row"><h1>Enquiries</h1><button id="refresh">Refresh</button><button id="logout">Log out</button></div><p class="muted">New requests appear here after customers submit the website form. Refresh to check for new enquiries. Project notes stay private.</p><div class="row"><input id="search" aria-label="Search enquiries" placeholder="Search name, phone, message"><select id="filter" aria-label="Filter status"><option value="">All statuses</option><option>new</option><option>contacted</option><option>quoted</option><option>agreed</option><option>in_progress</option><option>completed</option><option>closed</option></select></div><p id="count" class="muted"></p><div id="list"></div><button id="more" hidden>Load more</button></section>
</main><script src="/admin/admin.js" defer></script></body></html>
